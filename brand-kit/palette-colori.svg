<svg viewBox="0 0 900 420" width="1800" height="840" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Officina del Suono — palette colori</title>
  <rect width="900" height="420" fill="#09090B"/>

  <text x="50" y="58" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="700"
        letter-spacing="-0.5" fill="#FFFFFF">PALETTE COLORI</text>
  <text x="50" y="82" font-family="Inter, Arial, sans-serif" font-size="13" fill="#A1A1AA">
    Officina del Suono — nero, arancione, bianco
  </text>

  <!-- Colori principali -->
  <text x="50" y="122" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700"
        letter-spacing="2.5" fill="#F27D26">PRINCIPALI</text>

  <g>
    <rect x="50" y="136" width="180" height="110" rx="12" fill="#F27D26"/>
    <text x="66" y="222" font-family="Space Grotesk, Arial, sans-serif" font-size="17" font-weight="700" fill="#3A1606">#F27D26</text>
    <text x="66" y="238" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#3A1606">Arancione brand</text>
  </g>
  <g>
    <rect x="246" y="136" width="180" height="110" rx="12" fill="#000000" stroke="#27272A" stroke-width="1.5"/>
    <text x="262" y="222" font-family="Space Grotesk, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">#000000</text>
    <text x="262" y="238" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#A1A1AA">Nero</text>
  </g>
  <g>
    <rect x="442" y="136" width="180" height="110" rx="12" fill="#FFFFFF"/>
    <text x="458" y="222" font-family="Space Grotesk, Arial, sans-serif" font-size="17" font-weight="700" fill="#09090B">#FFFFFF</text>
    <text x="458" y="238" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#52525B">Bianco</text>
  </g>
  <g>
    <rect x="638" y="136" width="180" height="110" rx="12" fill="#FB923C"/>
    <text x="654" y="222" font-family="Space Grotesk, Arial, sans-serif" font-size="17" font-weight="700" fill="#3A1606">#FB923C</text>
    <text x="654" y="238" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#3A1606">Arancione chiaro</text>
  </g>

  <!-- Colori di supporto -->
  <text x="50" y="292" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700"
        letter-spacing="2.5" fill="#F27D26">SUPPORTO</text>

  <g>
    <rect x="50" y="306" width="180" height="78" rx="12" fill="#09090B" stroke="#27272A" stroke-width="1.5"/>
    <text x="66" y="345" font-family="Space Grotesk, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">#09090B</text>
    <text x="66" y="362" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A1A1AA">Sfondo scuro</text>
  </g>
  <g>
    <rect x="246" y="306" width="180" height="78" rx="12" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
    <text x="262" y="345" font-family="Space Grotesk, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">#18181B</text>
    <text x="262" y="362" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A1A1AA">Grigio scuro / box</text>
  </g>
  <g>
    <rect x="442" y="306" width="180" height="78" rx="12" fill="#A1A1AA"/>
    <text x="458" y="345" font-family="Space Grotesk, Arial, sans-serif" font-size="15" font-weight="700" fill="#09090B">#A1A1AA</text>
    <text x="458" y="362" font-family="Inter, Arial, sans-serif" font-size="10" fill="#3F3F46">Testo secondario</text>
  </g>
  <g>
    <rect x="638" y="306" width="180" height="78" rx="12" fill="#3A1606"/>
    <text x="654" y="345" font-family="Space Grotesk, Arial, sans-serif" font-size="15" font-weight="700" fill="#FB923C">#3A1606</text>
    <text x="654" y="362" font-family="Inter, Arial, sans-serif" font-size="10" fill="#FB923C">Testo su arancione</text>
  </g>
</svg>
