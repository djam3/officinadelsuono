<!--
  Marchio: un cono visto di fronte, con l'anello di sospensione aperto come su
  una tavola quotata e le barre di un livello dentro. Gli stessi colori del
  tema (cianografia), cosi' l'icona della scheda e il sito non si contraddicono.
-->
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="512" height="512">
  <defs>
    <linearGradient id="anello" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCE9F5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8EA8C2" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="barre" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5E6FA"/>
      <stop offset="100%" stop-color="#3E8FB0"/>
    </linearGradient>
    <radialGradient id="alone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FD8F5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7FD8F5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fondo: senza, su una scheda chiara il tratto sparisce -->
  <rect width="100" height="100" rx="22" fill="#0B1826"/>

  <circle cx="50" cy="50" r="40" fill="url(#alone)"/>

  <!-- anello interrotto, come una circonferenza di riferimento -->
  <circle cx="50" cy="50" r="40" fill="none"
    stroke="url(#anello)" stroke-width="3" stroke-linecap="round"
    stroke-dasharray="236 16" transform="rotate(-90 50 50)"/>

  <!-- circonferenza di costruzione, tratteggiata -->
  <circle cx="50" cy="50" r="32" fill="none"
    stroke="#DCE9F5" stroke-width="0.5" stroke-opacity="0.18" stroke-dasharray="2 3"/>

  <!-- assi -->
  <g stroke="#7FB2D9" stroke-width="0.6" stroke-opacity="0.35">
    <line x1="50" y1="8" x2="50" y2="18"/>
    <line x1="50" y1="82" x2="50" y2="92"/>
    <line x1="8" y1="50" x2="18" y2="50"/>
    <line x1="82" y1="50" x2="92" y2="50"/>
  </g>

  <g fill="url(#barre)">
    <rect x="32" y="36" width="5" height="28" rx="2.5"/>
    <rect x="41" y="41" width="5" height="18" rx="2.5"/>
    <rect x="50" y="32" width="5" height="36" rx="2.5"/>
    <rect x="59" y="43" width="5" height="14" rx="2.5"/>
  </g>
</svg>
