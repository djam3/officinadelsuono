<svg viewBox="0 0 420 260" width="840" height="520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Officina del Suono — logo verticale con slogan</title>
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#A1A1AA" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F27D26"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F27D26" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F27D26" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(160, 10)">
    <circle cx="50" cy="50" r="40" fill="url(#glow)"/>
    <circle cx="50" cy="50" r="44" stroke="url(#ring)" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="260 16" transform="rotate(-90 50 50)"/>
    <circle cx="50" cy="50" r="36" stroke="#FFFFFF" stroke-width="0.5"
            stroke-opacity="0.15" stroke-dasharray="2 3"/>
    <g fill="url(#bar)">
      <rect x="29.5" y="36" width="5" height="28" rx="2.5"/>
      <rect x="38.5" y="41" width="5" height="18" rx="2.5"/>
      <rect x="47.5" y="32" width="5" height="36" rx="2.5"/>
      <rect x="56.5" y="43" width="5" height="14" rx="2.5"/>
      <rect x="65.5" y="38" width="5" height="24" rx="2.5"/>
    </g>
    <g stroke="#F27D26" stroke-width="2" stroke-linecap="round">
      <line x1="50" y1="6" x2="50" y2="11"/>
      <line x1="94" y1="50" x2="89" y2="50"/>
      <line x1="50" y1="94" x2="50" y2="89"/>
      <line x1="6" y1="50" x2="11" y2="50"/>
    </g>
  </g>

  <text x="210" y="160" text-anchor="middle" font-family="Space Grotesk, Inter, Arial, sans-serif"
        font-size="38" font-weight="700" letter-spacing="-1.2" fill="#FFFFFF">OFFICINA</text>
  <text x="210" y="200" text-anchor="middle" font-family="Space Grotesk, Inter, Arial, sans-serif"
        font-size="38" font-weight="700" letter-spacing="-1.2" fill="#F27D26">DEL SUONO</text>
  <text x="210" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="13" font-weight="500" letter-spacing="4" fill="#A1A1AA">IL SUONO GIUSTO PER OGNI EVENTO</text>
</svg>
